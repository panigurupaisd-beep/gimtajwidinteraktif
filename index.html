  <script>
// === GAME DATA ===
const questions = [
  { arabic:"مِنْ خَيْرٍ", latin:"min khairin", answer:"Idzhar", hukum:"إظهار", hint:"Nun mati (نْ) bertemu huruf halqi (خ) → dibaca jelas", huruf:"خ adalah huruf halqi (tenggorokan)" },
  { arabic:"مَنْ عَمِلَ", latin:"man 'amila", answer:"Idzhar", hukum:"إظهار", hint:"Nun mati (نْ) bertemu huruf halqi (ع) → dibaca jelas", huruf:"ع adalah huruf halqi" },
  { arabic:"مِنْ وَلِيٍّ", latin:"min waliyyin", answer:"Idgham", hukum:"إدغام", hint:"Nun mati (نْ) bertemu و → dilebur dengan ghunnah", huruf:"و termasuk huruf Idgham (يرملون)" },
  { arabic:"مِنْ نِعْمَةٍ", latin:"min ni'matin", answer:"Idgham Mitsli", hukum:"إدغام مثلين", hint:"Nun mati (نْ) bertemu ن → dua huruf sama dilebur", huruf:"نْ bertemu ن = huruf yang sama" },
  { arabic:"مِنْ بَعْدِ", latin:"min ba'di", answer:"Iqlab", hukum:"إقلاب", hint:"Nun mati (نْ) bertemu ب → berubah jadi mim (م)", huruf:"ب adalah satu-satunya huruf Iqlab" },
  { arabic:"أَنْبِئْهُمْ", latin:"anbi'hum", answer:"Iqlab", hukum:"إقلاب", hint:"Nun mati (نْ) bertemu ب → bunyi berubah jadi م", huruf:"Ingat: نْ + ب = Iqlab!" },
  { arabic:"مِنْ شَرِّ", latin:"min syarri", answer:"Ikhfa", hukum:"إخفاء", hint:"Nun mati (نْ) bertemu ش → dibaca samar (dengung)", huruf:"ش termasuk 15 huruf Ikhfa" },
  { arabic:"مَنْ ذَا", latin:"man dzaa", answer:"Ikhfa", hukum:"إخفاء", hint:"Nun mati (نْ) bertemu ذ → dibaca samar dengan dengung", huruf:"ذ termasuk huruf Ikhfa" },
  { arabic:"عَلِيمٌ رَحِيمٌ", latin:"'aliimun rahiim", answer:"Idgham", hukum:"إدغام", hint:"Tanwin (ـٌ) bertemu ر → dilebur tanpa ghunnah", huruf:"ر termasuk huruf Idgham (يرملون)" },
  { arabic:"مِنْ كُلٍّ", latin:"min kullin", answer:"Ikhfa", hukum:"إخفاء", hint:"Nun mati (نْ) bertemu ك → dibaca samar", huruf:"ك termasuk 15 huruf Ikhfa" }
];

const answerColors = {
  "Idzhar": { bg:"bg-rose-500 hover:bg-rose-400", ring:"ring-rose-300" },
  "Idgham": { bg:"bg-blue-500 hover:bg-blue-400", ring:"ring-blue-300" },
  "Iqlab": { bg:"bg-amber-500 hover:bg-amber-400", ring:"ring-amber-300" },
  "Ikhfa": { bg:"bg-purple-500 hover:bg-purple-400", ring:"ring-purple-300" },
  "Idgham Mitsli": { bg:"bg-teal-500 hover:bg-teal-400", ring:"ring-teal-300" }
};

const answerEmojis = { "Idzhar":"🔊", "Idgham":"🔄", "Iqlab":"🔀", "Ikhfa":"🤫", "Idgham Mitsli":"🔁" };

let currentQ = 0, stars = 0, streak = 0, answered = false, shuffled = [];

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function startGame() {
  currentQ = 0; stars = 0; streak = 0;
  shuffled = shuffleArray(questions);
  document.getElementById('splash-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'flex';
  showQuestion();
}

function exitGame() {
  // Reset game state and show confirmation inline
  currentQ = 0; stars = 0; streak = 0; answered = false;
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('splash-screen').style.display = 'flex';
}

function showQuestion() {
  answered = false;
  const q = shuffled[currentQ];
  document.getElementById('progress-text').textContent = `${currentQ + 1} / ${shuffled.length}`;
  document.getElementById('progress-bar').style.width = `${((currentQ + 1) / shuffled.length) * 100}%`;
  document.getElementById('stars-display').textContent = `⭐ ${stars}`;
  document.getElementById('hint-text').textContent = `💡 ${q.hint}`;
  document.getElementById('example-arabic').textContent = q.arabic;
  document.getElementById('example-latin').textContent = q.latin;
  document.getElementById('feedback-text').textContent = '';
  document.getElementById('feedback-detail').textContent = '';

  const streakEl = document.getElementById('streak-display');
  if (streak >= 2) { streakEl.style.display = ''; streakEl.textContent = `🔥 ${streak}`; }
  else { streakEl.style.display = 'none'; }

  // Build answer buttons — get unique answer set for this question
  const container = document.getElementById('answers-container');
  container.innerHTML = '';
  const options = getOptions(q.answer);
  options.forEach((opt, i) => {
    const c = answerColors[opt];
    const btn = document.createElement('button');
    btn.className = `${c.bg} text-white font-bold py-3 px-4 rounded-2xl shadow-lg transition-all active:scale-95 card-glow float-in text-sm md:text-base`;
    btn.style.animationDelay = `${i * 0.07}s`;
    btn.innerHTML = `${answerEmojis[opt]} ${opt}`;
    btn.onclick = () => checkAnswer(opt, btn);
    container.appendChild(btn);
  });

  // Animate card
  const card = document.getElementById('example-card');
  card.classList.remove('bounce-in');
  void card.offsetWidth;
  card.classList.add('bounce-in');
}

function getOptions(correct) {
  const all = Object.keys(answerColors);
  const others = shuffleArray(all.filter(a => a !== correct)).slice(0, 3);
  return shuffleArray([correct, ...others]);
}

function checkAnswer(choice, btn) {
  if (answered) return;
  answered = true;
  const q = shuffled[currentQ];
  const isCorrect = choice === q.answer;
  const allBtns = document.querySelectorAll('#answers-container button');

  if (isCorrect) {
    const earned = streak >= 2 ? 2 : 1;
    stars += earned;
    streak++;
    btn.classList.add('pop');
    btn.classList.add('ring-4', answerColors[choice].ring);
    document.getElementById('feedback-text').innerHTML = `<span class="text-yellow-300">${earned > 1 ? '🌟🌟 Kombo! +2' : '⭐ Benar! +1'} Bintang</span>`;
    document.getElementById('feedback-detail').textContent = `${q.hukum} — ${q.huruf}`;
    spawnConfetti(btn);
    // Dim wrong buttons
    allBtns.forEach(b => { if (b !== btn) b.classList.add('opacity-30'); });
  } else {
    streak = 0;
    btn.classList.add('shake', 'opacity-50');
    // Highlight correct
    allBtns.forEach(b => {
      if (b.textContent.includes(q.answer)) {
        b.classList.add('ring-4', answerColors[q.answer].ring, 'pop');
      } else if (b !== btn) {
        b.classList.add('opacity-30');
      }
    });
    document.getElementById('feedback-text').innerHTML = `<span class="text-rose-300">Belum tepat 😊</span>`;
    document.getElementById('feedback-detail').textContent = `Jawaban: ${q.answer} (${q.hukum}) — ${q.huruf}`;
  }

  document.getElementById('stars-display').textContent = `⭐ ${stars}`;
  const streakEl = document.getElementById('streak-display');
  if (streak >= 2) { streakEl.style.display = ''; streakEl.textContent = `🔥 ${streak}`; }
  else { streakEl.style.display = 'none'; }

  setTimeout(() => {
    currentQ++;
    if (currentQ < shuffled.length) showQuestion();
    else showResult();
  }, 1800);
}

function spawnConfetti(target) {
  const rect = target.getBoundingClientRect();
  const colors = ['#fbbf24','#34d399','#f472b6','#60a5fa','#a78bfa'];
  for (let i = 0; i < 10; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.left = `${rect.left + rect.width / 2 + (Math.random() - 0.5) * 60}px`;
    p.style.top = `${rect.top}px`;
    p.style.animationDelay = `${Math.random() * 0.3}s`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1500);
  }
}

function showResult() {
  document.getElementById('game-screen').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'flex';
  const pct = Math.round((stars / (shuffled.length * 2)) * 100);
  let emoji, msg, grade;
  if (stars >= 15) { emoji = '🏆'; msg = 'Luar Biasa! Kamu Ahli Tajwid!'; grade = 'Mumtaz (Sempurna)'; }
  else if (stars >= 10) { emoji = '🌟'; msg = 'Hebat Sekali!'; grade = 'Jayyid Jiddan (Sangat Baik)'; }
  else if (stars >= 6) { emoji = '👍'; msg = 'Bagus! Terus Berlatih!'; grade = 'Jayyid (Baik)'; }
  else { emoji = '💪'; msg = 'Semangat! Coba Lagi Ya!'; grade = 'Maqbul (Cukup)'; }

  document.getElementById('result-content').innerHTML = `
    <div class="float-in text-7xl mb-4">${emoji}</div>
    <h2 class="float-in text-3xl md:text-4xl font-extrabold text-white mb-2" style="animation-delay:0.1s">${msg}</h2>
    <p class="float-in text-emerald-200 text-lg mb-6" style="animation-delay:0.2s">${grade}</p>
    <div class="float-in bg-white/15 backdrop-blur rounded-2xl p-6 max-w-xs mx-auto mb-8 border border-white/20" style="animation-delay:0.3s">
      <p class="text-yellow-300 text-4xl font-extrabold mb-1">⭐ ${stars}</p>
      <p class="text-emerald-200 text-sm">dari ${shuffled.length} soal</p>
    </div>
    <button onclick="startGame()" class="float-in bg-yellow-400 hover:bg-yellow-300 text-emerald-900 font-extrabold text-lg px-8 py-3 rounded-full shadow-lg hover:scale-105 active:scale-95 transition-all" style="animation-delay:0.4s">
      Main Lagi! 🔄
    </button>
  `;
}

// === ELEMENT SDK ===
const defaultConfig = {
  game_title: "Gim Tajwid Interaktif",
  subtitle_text: "Nun Mati & Tanwin 📖",
  background_color: "#0d4a3e",
  surface_color: "#ffffff",
  text_color: "#065f46",
  accent_color: "#fbbf24",
  secondary_action_color: "#34d399",
  font_family: "Baloo 2",
  font_size: 16
};

function applyConfig(config) {
  const t = config.game_title || defaultConfig.game_title;
  const s = config.subtitle_text || defaultConfig.subtitle_text;
  const bg = config.background_color || defaultConfig.background_color;
  const surface = config.surface_color || defaultConfig.surface_color;
  const txt = config.text_color || defaultConfig.text_color;
  const accent = config.accent_color || defaultConfig.accent_color;
  const sec = config.secondary_action_color || defaultConfig.secondary_action_color;
  const ff = config.font_family || defaultConfig.font_family;
  const fs = config.font_size || defaultConfig.font_size;

  const el = (id) => document.getElementById(id);
  if (el('main-title')) el('main-title').textContent = t;
  if (el('main-subtitle')) el('main-subtitle').textContent = s;

  // Background
  document.getElementById('app').style.background = `linear-gradient(135deg, ${bg} 0%, ${lighten(bg, 15)} 50%, ${bg} 100%)`;

  // Surface color on cards
  const exCard = el('example-card');
  if (exCard) exCard.style.backgroundColor = surface;

  // Text color
  if (el('example-label')) el('example-label').style.color = txt;

  // Accent on buttons & stars
  document.querySelectorAll('.bg-yellow-400').forEach(b => { b.style.backgroundColor = accent; });

  // Font
  const fontStack = `${ff}, 'Baloo 2', cursive`;
  document.body.style.fontFamily = fontStack;
  document.querySelectorAll('h1,h2,p,button,span').forEach(e => {
    if (!e.classList.contains('arabic')) e.style.fontFamily = fontStack;
  });

  // Font size scaling
  if (el('main-title')) el('main-title').style.fontSize = `${fs * 2.2}px`;
  if (el('main-subtitle')) el('main-subtitle').style.fontSize = `${fs * 1.2}px`;
}

function lighten(hex, pct) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r + Math.round((255-r)*pct/100));
  g = Math.min(255, g + Math.round((255-g)*pct/100));
  b = Math.min(255, b + Math.round((255-b)*pct/100));
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => applyConfig(config),
  mapToCapabilities: (config) => ({
    recolorables: [
      { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
      { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
      { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
      { get: () => config.accent_color || defaultConfig.accent_color, set: (v) => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } },
      { get: () => config.secondary_action_color || defaultConfig.secondary_action_color, set: (v) => { config.secondary_action_color = v; window.elementSdk.setConfig({ secondary_action_color: v }); } },
    ],
    borderables: [],
    fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
    fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } },
  }),
  mapToEditPanelValues: (config) => new Map([
    ["game_title", config.game_title || defaultConfig.game_title],
    ["subtitle_text", config.subtitle_text || defaultConfig.subtitle_text],
  ])
});
</script>
